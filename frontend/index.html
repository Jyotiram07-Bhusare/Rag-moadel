<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LessonLoop</title>
  <meta name="description" content="Tell LessonLoop a topic. It writes a beginner lesson, checks it against 14 hard pass/fail rules, rewrites it until it passes, and shows you only the lesson that passes.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c83ff'/%3E%3Cpath d='M9 16a7 7 0 0 1 12-5m2 5a7 7 0 0 1-12 5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M21 7v4h-4M11 25v-4h4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    /* Set the theme before first paint so the page never flashes the wrong colours.
       "lessonloop.theme" is shared with dashboard.html; no value means "follow the system". */
    (function () {
      try {
        var t = localStorage.getItem('lessonloop.theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>

  <!-- ============ ICON SPRITE (every icon in the page is <use href="#i-name">) ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c83ff"/><stop offset="1" stop-color="#b17cff"/></linearGradient>

      <symbol id="i-logo" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="9" fill="url(#lg)"/>
        <path d="M9 16a7 7 0 0 1 12-5m2 5a7 7 0 0 1-12 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M21 7v4h-4M11 25v-4h4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></symbol>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-thumb-up" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></symbol>
      <symbol id="i-thumb-down" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    </defs>
  </svg>

  <a class="skip" href="#composer-input">Skip to message box</a>

  <div class="app" id="app" data-sidebar="open">
    <script>
      /* Decide the sidebar state before first paint (closed on phones, or if the user closed it), so it never flashes. */
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('lessonloop.chat.prefs.v1') || '{}');
          var open = !window.matchMedia('(max-width: 900px)').matches && p.sidebar !== false;
          document.getElementById('app').setAttribute('data-sidebar', open ? 'open' : 'closed');
        } catch (e) {}
      })();
    </script>

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sb-inner">
        <div class="sb-top">
          <button class="sb-logo" type="button" data-action="new-chat" aria-label="LessonLoop, start a new chat" title="New chat">
            <svg class="ico logo-ico" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg>
          </button>
          <button class="icon-btn" type="button" data-action="toggle-sidebar" aria-label="Close sidebar" title="Close sidebar">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-sidebar"/></svg>
          </button>
        </div>

        <div class="sb-nav">
          <button class="sb-item" type="button" data-action="new-chat">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-new"/></svg><span>New chat</span>
          </button>
          <button class="sb-item" type="button" data-action="open-search">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-search"/></svg><span>Search chats</span>
          </button>
          <button class="sb-item" type="button" data-action="open-settings" data-tab="memory">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-sparkle"/></svg><span>Memory</span>
          </button>
          <button class="sb-item" type="button" data-action="open-settings" data-tab="general">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg><span>Settings</span>
          </button>
        </div>

        <nav class="sb-scroll" id="chat-list" aria-label="Chat history"></nav>

        <div class="sb-foot">
          <button class="profile" type="button" id="profile-btn" data-action="profile-menu" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-user"/></svg></span>
            <span class="profile-text"><b>Guest</b><small id="profile-sub">Demo mode</small></span>
          </button>
        </div>
      </div>
    </aside>
    <div class="sb-backdrop" id="sb-backdrop" data-action="toggle-sidebar" hidden></div>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <div class="tb-left">
          <button class="icon-btn tb-open" type="button" data-action="toggle-sidebar" aria-label="Open sidebar" title="Open sidebar">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-sidebar"/></svg>
          </button>
          <button class="icon-btn tb-new" type="button" data-action="new-chat" aria-label="New chat" title="New chat">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-new"/></svg>
          </button>
          <div class="model-btn static"><span class="model-name">LessonLoop</span></div>
        </div>
        <div class="tb-right">
          <button class="icon-btn theme-btn" type="button" data-action="theme-toggle" aria-label="Switch light or dark theme" title="Switch theme">
            <svg class="ico ico-moon" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg>
            <svg class="ico ico-sun" aria-hidden="true" focusable="false"><use href="#i-sun"/></svg>
          </button>
        </div>
      </header>

      <main class="thread-wrap" id="main" data-empty="true">
        <div class="scroller" id="scroller">
          <div class="hero" id="hero">
            <h1>What do you want to learn today?</h1>
            <p>Type a topic. I’ll write a beginner lesson, check it against 14 rules, and show it only when it passes.</p>
          </div>
          <div class="thread" id="thread" role="log" aria-live="off" aria-label="Conversation"></div>
        </div>

        <div class="composer-zone">
          <button class="to-bottom" id="to-bottom" type="button" data-action="scroll-bottom" aria-label="Scroll to the latest message" title="Scroll to bottom" hidden>
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-arrow-down"/></svg>
          </button>
          <div class="composer-inner">
            <form class="composer" id="composer" autocomplete="off">
              <button class="c-btn plus" type="button" id="plus-btn" data-action="plus-menu" aria-label="Options" title="Options" aria-haspopup="menu" aria-expanded="false">
                <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg>
              </button>
              <label class="sr-only" for="composer-input">Message</label>
              <textarea id="composer-input" rows="1" maxlength="500" placeholder="Type a topic, e.g. Introduction to RAG"></textarea>
              <button class="c-btn send" type="submit" id="send-btn" aria-label="Send message" title="Send" disabled>
                <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-arrow-up"/></svg>
              </button>
            </form>
            <div class="chips" id="chips"></div>
            <p class="foot-note" id="foot-note"></p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ============ SETTINGS ============ -->
  <dialog id="settings" class="modal settings" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon-btn" type="button" data-action="close-dialog" aria-label="Close settings">
        <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <nav class="settings-nav" id="settings-nav" aria-label="Settings sections"></nav>
      <div class="settings-pane" id="settings-pane"></div>
    </div>
  </dialog>

  <!-- ============ SEARCH ============ -->
  <dialog id="search" class="modal search" aria-label="Search chats">
    <div class="search-box">
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
      <input id="search-input" type="text" placeholder="Search chats…" autocomplete="off" spellcheck="false" aria-label="Search chats">
      <button class="icon-btn" type="button" data-action="close-dialog" aria-label="Close search">
        <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="search-results" id="search-results"></div>
  </dialog>

  <!-- ============ CONFIRM ============ -->
  <dialog id="confirm" class="modal confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="btn ghost" id="confirm-cancel" value="cancel">Cancel</button>
        <button class="btn danger" id="confirm-ok" value="ok">Delete</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" popover="manual" aria-live="polite"></div>
  <div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept="application/pdf,image/*" hidden>

  <script src="js/rubric.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/evaluator.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/chat-store.js"></script>
  <script src="js/chat-ui.js"></script>
  <script src="js/rag-kb.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
